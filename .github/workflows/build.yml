name: Build

on:
  push:
    branches:
     - main
    tags:
    - v*
  pull_request:
    branches:
      - main

jobs:
  build:
    name: "Build & package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for minver to create the right version number
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish Test Summary
        if: always()
        run: python3 scripts/generate-test-summary.py ./TestResults/test-results.trx

      - name: Package
        run: dotnet pack src/GovUk.OneLogin.AspNetCore/ --configuration Release --no-build

      - name: Publish package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GovUk.OneLogin.AspNetCore.nupkg
          path: src/GovUk.OneLogin.AspNetCore/bin/Release/*.nupkg

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'DFE-Digital/govuk-onelogin-aspnetcore'

    steps:
    - name: Download package artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: GovUk.OneLogin.AspNetCore.nupkg

    - name: Publish package to NuGet
      run: dotnet nuget push **/*.nupkg --api-key $NUGET_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
